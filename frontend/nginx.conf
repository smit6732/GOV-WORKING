server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) caches resolution per its own TTL;
    # using a variable in proxy_pass forces nginx to re-resolve "backend"
    # through it on each request instead of caching the IP at nginx startup
    # (which would go stale across a `docker compose restart backend`).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws/alerts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;

        # The backend sets no explicit Cache-Control on its JSON
        # responses -- directly observed the consequence: the browser
        # served a stale /api/feeds response from before a real registry
        # change (hls_url and nearest_station updated by a sync script)
        # across multiple fresh navigations, with the correct data
        # confirmed reachable via a manual cache-bypassing fetch the
        # whole time. API responses should never be cached by the
        # browser regardless of what the backend itself sends.
        add_header Cache-Control "no-store" always;
    }

    # Vite's built asset filenames are content-hashed (index-<hash>.js) --
    # safe to cache aggressively/immutably, since a rebuild produces a
    # brand new filename rather than changing this one's content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is NOT hashed and references whichever asset filenames
    # were current at build time -- caching it without revalidation means
    # a rebuilt frontend keeps serving old JS/CSS (referencing files that
    # may no longer exist, or just missing new code) until something
    # forces a hard refresh. Directly observed this session: a real
    # frontend fix was built, rebuilt, and recreated, but the running
    # browser tab kept using the previous bundle across multiple normal
    # navigations because nginx's default static-file caching let it.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
