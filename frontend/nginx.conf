server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) caches resolution per its own TTL;
    # using a variable in proxy_pass forces nginx to re-resolve "backend"
    # through it on each request instead of caching the IP at nginx startup
    # (which would go stale across a `docker compose restart backend`).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws/alerts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
